<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPX Truck Lock GPS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#F4F5F8;
  --surface:#FFFFFF;
  --surface-2:#EEF1F6;
  --navy:#131F38;
  --navy-2:#1D2D4D;
  --navy-3:#28406B;
  --accent:#E28F35;
  --accent-dark:#C97620;
  --accent-bg:#FCEBD6;
  --success:#1F8B4C;
  --success-bg:#E2F5EA;
  --warning:#B4740E;
  --warning-bg:#FBEED4;
  --slate:#5B6478;
  --slate-bg:#E8EBF0;
  --danger:#C0392B;
  --danger-bg:#FBEAE8;
  --border:#DDE2EA;
  --text:#131A2A;
  --text-dim:#5B6478;
  --font-display:'Space Grotesk', sans-serif;
  --font-body:'Inter', sans-serif;
  --font-mono:'JetBrains Mono', monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
#app{min-height:100vh;}
a{color:inherit;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
::selection{background:var(--accent-bg);}

/* ---------- Scrollbar ---------- */
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:#C7CEDA;border-radius:6px;}
::-webkit-scrollbar-track{background:transparent;}

/* ---------- Login ---------- */
.login-wrap{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 15% 20%, rgba(226,143,53,0.10), transparent 40%),
    radial-gradient(circle at 85% 80%, rgba(40,64,107,0.12), transparent 45%),
    var(--navy);
  padding:24px;
}
.login-card{
  background:var(--surface);
  width:100%;
  max-width:420px;
  border-radius:14px;
  padding:38px 36px 32px;
  box-shadow:0 30px 60px -20px rgba(0,0,0,0.5);
  position:relative;
  overflow:hidden;
}
.login-card::before{
  content:"";
  position:absolute;
  top:0;left:0;right:0;height:6px;
  background:linear-gradient(90deg,var(--navy) 0%,var(--navy) 48%,var(--accent) 48%,var(--accent) 100%);
}
.brand-mark{
  display:flex;align-items:center;gap:10px;margin-bottom:6px;
}
.seal-icon{width:36px;height:36px;flex-shrink:0;}
.brand-name{
  font-family:var(--font-display);
  font-weight:700;
  font-size:22px;
  letter-spacing:-0.02em;
  color:var(--navy);
}
.brand-sub{
  font-size:12.5px;
  color:var(--text-dim);
  margin:0 0 28px;
  padding-left:46px;
  letter-spacing:0.02em;
}
.field{margin-bottom:16px;}
.field label{
  display:block;font-size:12px;font-weight:600;color:var(--text-dim);
  text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px;
}
.field input, .field select, .field textarea{
  width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:8px;
  font-size:14.5px;color:var(--text);background:var(--surface);transition:border-color .15s;
}
.field input:focus, .field select:focus, .field textarea:focus{
  outline:none;border-color:var(--navy-3);
}
.btn{
  border:none;border-radius:8px;padding:11px 18px;font-size:14px;font-weight:600;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:transform .08s, box-shadow .15s, background .15s;
  white-space:nowrap;
}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--navy);color:#fff;}
.btn-primary:hover{background:var(--navy-2);}
.btn-accent{background:var(--accent);color:#fff;}
.btn-accent:hover{background:var(--accent-dark);}
.btn-ghost{background:var(--surface-2);color:var(--text);}
.btn-ghost:hover{background:#E1E5EC;}
.btn-danger{background:var(--danger-bg);color:var(--danger);}
.btn-danger:hover{background:#F6D5D1;}
.btn-success{background:var(--success-bg);color:var(--success);}
.btn-success:hover{background:#CFEEDC;}
.btn-block{width:100%;}
.btn-sm{padding:6px 11px;font-size:12.5px;border-radius:6px;}
.btn:disabled{opacity:0.42;cursor:not-allowed;}
.login-btn{margin-top:6px;}
.login-hint{
  margin-top:20px;padding:12px 14px;background:var(--surface-2);border-radius:8px;
  font-size:12.5px;color:var(--text-dim);line-height:1.5;
}
.login-hint b{color:var(--text);font-family:var(--font-mono);}
.login-error{
  background:var(--danger-bg);color:var(--danger);font-size:13px;padding:10px 12px;
  border-radius:8px;margin-bottom:16px;font-weight:500;
}

/* ---------- App shell ---------- */
.shell{display:flex;min-height:100vh;}
.sidebar{
  width:230px;flex-shrink:0;background:var(--navy);color:#fff;
  display:flex;flex-direction:column;padding:22px 14px;position:sticky;top:0;height:100vh;
}
.sb-brand{display:flex;align-items:center;gap:10px;padding:2px 8px 22px;border-bottom:1px solid rgba(255,255,255,0.1);margin-bottom:18px;}
.sb-brand .seal-icon{width:28px;height:28px;}
.sb-brand-text{font-family:var(--font-display);font-weight:700;font-size:17px;letter-spacing:-0.02em;}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;
  color:rgba(255,255,255,0.72);font-size:14px;font-weight:500;margin-bottom:3px;
  background:none;border:none;width:100%;text-align:left;transition:background .12s,color .12s;
}
.nav-item:hover{background:rgba(255,255,255,0.06);color:#fff;}
.nav-item.active{background:var(--accent);color:#fff;font-weight:600;}
.nav-item svg{flex-shrink:0;width:17px;height:17px;}
.sb-footer{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,0.1);}
.sb-user{padding:8px 10px;font-size:12.5px;color:rgba(255,255,255,0.65);margin-bottom:8px;}
.sb-user b{color:#fff;display:block;font-size:13.5px;margin-bottom:1px;}
.tag-pill{
  display:inline-block;font-size:10.5px;font-weight:700;text-transform:uppercase;
  letter-spacing:0.05em;padding:2px 7px;border-radius:20px;margin-top:4px;
}
.tag-admin{background:var(--accent);color:#fff;}
.tag-dest{background:rgba(255,255,255,0.14);color:#fff;}

.main{flex:1;min-width:0;padding:26px 32px 60px;}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:12px;}
.page-title{font-family:var(--font-display);font-size:25px;font-weight:700;letter-spacing:-0.01em;margin:0;}
.page-sub{color:var(--text-dim);font-size:13.5px;margin:3px 0 0;}

/* ---------- Cards / summary ---------- */
.grid-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:24px;}
.stat-card{
  background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 18px 16px;
  position:relative;overflow:hidden;cursor:pointer;user-select:none;
  transition:transform .1s ease, box-shadow .15s ease, border-color .15s ease;
}
.stat-card:hover{transform:translateY(-2px);box-shadow:0 10px 24px -12px rgba(19,31,56,0.25);}
.stat-card:active{transform:translateY(0);}
.stat-card:focus-visible{outline:2px solid var(--navy-3);outline-offset:2px;}
.stat-card.is-active{border-color:var(--navy-3);box-shadow:0 0 0 2px rgba(29,45,77,0.14);}
.stat-card::after{content:"";position:absolute;top:0;left:0;bottom:0;width:4px;}
.stat-card.c-total::after{background:var(--navy-3);}
.stat-card.c-available::after{background:var(--slate);}
.stat-card.c-assigned::after{background:var(--warning);}
.stat-card.c-received::after{background:var(--success);}
.stat-label{font-size:11.5px;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-dim);font-weight:600;}
.stat-value{font-family:var(--font-display);font-size:32px;font-weight:700;margin-top:6px;}

.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px 22px;margin-bottom:20px;}
.panel-title{font-family:var(--font-display);font-weight:600;font-size:16.5px;margin:0 0 4px;}
.panel-sub{font-size:12.5px;color:var(--text-dim);margin:0 0 14px;}

/* ---------- Table ---------- */
.table-toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px;}
.table-toolbar .grow{flex:1;min-width:160px;}
.search-input{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:13.5px;}
.search-input:focus{outline:none;border-color:var(--navy-3);}
.filter-select{padding:9px 10px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;background:var(--surface);}
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px;}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:820px;}
thead th{
  background:var(--surface-2);text-align:left;padding:10px 12px;font-size:11px;
  text-transform:uppercase;letter-spacing:0.05em;color:var(--text-dim);font-weight:700;
  border-bottom:1px solid var(--border);white-space:nowrap;
}
tbody td{padding:10px 12px;border-bottom:1px solid #EEF0F4;vertical-align:middle;white-space:nowrap;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:#FAFBFD;}
.mono{font-family:var(--font-mono);font-weight:600;letter-spacing:0.01em;}
.empty-row td{text-align:center;padding:36px 12px;color:var(--text-dim);}

.badge{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;
  font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.03em;
}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;}
.badge-available{background:var(--slate-bg);color:var(--slate);}
.badge-assigned{background:var(--warning-bg);color:var(--warning);}
.badge-received{background:var(--success-bg);color:var(--success);}
.badge-returning{background:#ede9fe;color:#6d28d9;}
.stat-card.c-returning::after{background:#8b5cf6;}

.action-row{display:flex;gap:6px;flex-wrap:wrap;}
.row-check{width:16px;height:16px;accent-color:var(--navy);}

/* ---------- Modal ---------- */
.modal-overlay{
  position:fixed;inset:0;background:rgba(15,20,35,0.55);display:flex;align-items:center;
  justify-content:center;z-index:100;padding:20px;backdrop-filter:blur(2px);
}
.modal{
  background:var(--surface);border-radius:14px;max-width:560px;width:100%;max-height:88vh;
  overflow-y:auto;box-shadow:0 30px 70px -15px rgba(0,0,0,0.4);
}
.modal-header{padding:20px 24px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;}
.modal-title{font-family:var(--font-display);font-weight:700;font-size:18px;margin:0;}
.modal-sub{font-size:12.5px;color:var(--text-dim);margin:4px 0 0;}
.modal-close{background:none;border:none;font-size:20px;color:var(--text-dim);line-height:1;padding:4px;}
.modal-body{padding:20px 24px;}
.modal-footer{padding:16px 24px 22px;display:flex;gap:10px;justify-content:flex-end;border-top:1px solid var(--border);}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.chip-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;max-height:110px;overflow-y:auto;padding:2px;}
.chip{background:var(--surface-2);border-radius:20px;padding:4px 10px;font-size:12px;font-family:var(--font-mono);font-weight:600;}
.upload-drop{
  border:1.5px dashed var(--border);border-radius:10px;padding:22px;text-align:center;background:var(--surface-2);
}
.upload-drop input[type=file]{display:block;margin:10px auto 0;font-size:12.5px;}
.divider-or{display:flex;align-items:center;gap:10px;margin:16px 0;color:var(--text-dim);font-size:11.5px;text-transform:uppercase;letter-spacing:0.06em;}
.divider-or::before,.divider-or::after{content:"";flex:1;height:1px;background:var(--border);}
.helper-text{font-size:11.5px;color:var(--text-dim);margin-top:5px;line-height:1.5;}
.template-link{font-size:12px;color:var(--navy-3);font-weight:600;text-decoration:underline;background:none;border:none;padding:0;}

/* ---------- Allocation ---------- */
.alloc-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:20px;}
.alloc-lock-chips{display:flex;flex-wrap:wrap;gap:5px;max-width:420px;}
.alloc-lock-chips .chip{padding:2px 8px;font-size:11.5px;}
.chip-more{background:var(--accent-bg);color:var(--accent-dark);border:none;cursor:pointer;border-radius:20px;padding:2px 9px;font-size:11.5px;font-weight:700;}
.qty-num{font-family:var(--font-mono);font-weight:700;font-size:14px;}
.bal-ok{color:var(--success);} .bal-low{color:var(--warning);} .bal-over{color:var(--danger);}
.prog{height:6px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin-top:5px;min-width:90px;}
.prog>div{height:100%;background:var(--success);}
.prog.over>div{background:var(--danger);}
.badge-noquota{background:var(--surface-2);color:var(--text-dim);}

.chip-res{background:#fff !important;border:1px dashed var(--slate);color:var(--slate);}

.dest-stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;}
.stat-breakdown{margin-top:10px;display:grid;gap:3px;font-size:12px;color:var(--text-dim);}
.stat-breakdown span{display:flex;justify-content:space-between;gap:10px;}
.stat-breakdown em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.stat-breakdown b{color:var(--text);font-family:var(--font-mono);}
.stat-card:not([role="button"]){cursor:default;}
.stat-card:not([role="button"]):hover{transform:none;box-shadow:none;}

.stat-sub{font-size:12px;color:var(--text-dim);margin-top:2px;}
.stat-extra{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;padding:7px 10px;border-radius:8px;background:var(--surface-2);font-size:12px;font-weight:600;}
.stat-extra b{font-family:var(--font-mono);font-size:15px;color:var(--navy-3);}

/* ---------- Toast ---------- */
.toast-stack{position:fixed;bottom:22px;right:22px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{
  background:var(--navy);color:#fff;padding:12px 16px;border-radius:9px;font-size:13.5px;font-weight:500;
  box-shadow:0 12px 30px -8px rgba(0,0,0,0.4);min-width:220px;animation:toastIn .18s ease-out;
}
.toast.err{background:var(--danger);}
.toast.ok{background:var(--success);}
@keyframes toastIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

.summary-mini-table{width:100%;border-collapse:collapse;font-size:13px;}
.summary-mini-table th{text-align:left;padding:8px 10px;color:var(--text-dim);font-size:11px;text-transform:uppercase;letter-spacing:0.04em;border-bottom:1px solid var(--border);}
.summary-mini-table td{padding:8px 10px;border-bottom:1px solid #F0F1F5;}
.summary-mini-table tr:last-child td{border-bottom:none;}

.dest-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px;
  max-height:440px;overflow-y:auto;padding:2px 4px 2px 2px;
}
.dest-card{
  background:var(--surface-2);border:1.5px solid var(--border);border-radius:10px;padding:13px 14px 12px;
  cursor:pointer;user-select:none;transition:transform .1s ease, box-shadow .15s ease, border-color .15s ease, background .15s ease;
}
.dest-card:hover{transform:translateY(-2px);box-shadow:0 8px 18px -10px rgba(19,31,56,0.25);}
.dest-card:focus-visible{outline:2px solid var(--navy-3);outline-offset:2px;}
.dest-card.is-active{border-color:var(--accent);background:var(--accent-bg);box-shadow:0 0 0 2px rgba(226,143,53,0.16);}
.dest-card-name{
  font-size:11.5px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.03em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.dest-card-value{font-family:var(--font-display);font-size:26px;font-weight:700;margin-top:5px;color:var(--success);}
.dest-card.is-active .dest-card-value{color:var(--accent-dark);}
.dest-card-sub{font-size:11px;color:var(--text-dim);margin-top:2px;}
.dest-card-sub2{font-size:11px;color:var(--warning);margin-top:1px;font-weight:600;}

.two-col{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;align-items:start;}
@media(max-width:960px){.two-col{grid-template-columns:1fr;}}

.export-menu-wrap{position:relative;display:inline-block;}
.export-menu{
  position:absolute;top:calc(100% + 6px);right:0;background:var(--surface);border:1px solid var(--border);
  border-radius:9px;box-shadow:0 14px 32px -10px rgba(0,0,0,0.25);min-width:170px;overflow:hidden;z-index:20;
}
.export-menu button{
  display:block;width:100%;text-align:left;padding:10px 14px;background:none;border:none;font-size:13px;font-weight:500;
}
.export-menu button:hover{background:var(--surface-2);}

.empty-state{text-align:center;padding:50px 20px;color:var(--text-dim);}
.empty-state svg{width:46px;height:46px;margin-bottom:10px;opacity:0.5;}
.empty-state h4{margin:0 0 4px;color:var(--text);font-family:var(--font-display);}
.empty-state p{margin:0;font-size:13px;}

@media(max-width:760px){
  .shell{flex-direction:column;}
  .sidebar{width:100%;height:auto;position:relative;flex-direction:row;flex-wrap:wrap;padding:12px;}
  .sb-brand{display:none;}
  .sb-footer{display:none;}
  .main{padding:18px;}
  .form-row{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================================
   SPX Truck Lock GPS
   Single-file HTML/JS app. Data persisted via window.storage (shared=true)
   so it syncs across everyone who opens this artifact.
   ========================================================================= */

/* ---------------- Icons (inline SVG strings) ---------------- */
const ICONS = {
  seal: `<svg class="seal-icon" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
    <circle cx="20" cy="20" r="18" stroke="#E28F35" stroke-width="2.6"/>
    <circle cx="20" cy="20" r="12.5" stroke="#E28F35" stroke-width="1.4" stroke-dasharray="2 3"/>
    <path d="M14 19V16.5C14 13.46 16.24 11 19.5 11C22.4 11 24.8 13.05 25.3 15.7" stroke="#E28F35" stroke-width="2.2" stroke-linecap="round"/>
    <rect x="13.5" y="19" width="12" height="9.5" rx="2" fill="#E28F35"/>
  </svg>`,
  dash: `<svg viewBox="0 0 24 24" fill="none"><path d="M4 13h6V4H4v9zM14 20h6V4h-6v16zM4 20h6v-4H4v4z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>`,
  lock: `<svg viewBox="0 0 24 24" fill="none"><rect x="5" y="10" width="14" height="9" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M8 10V7a4 4 0 018 0v3" stroke="currentColor" stroke-width="1.8"/></svg>`,
  route: `<svg viewBox="0 0 24 24" fill="none"><circle cx="6" cy="6" r="2.4" stroke="currentColor" stroke-width="1.8"/><circle cx="18" cy="18" r="2.4" stroke="currentColor" stroke-width="1.8"/><path d="M8 7c3 0 2 6 5 6h3" stroke="currentColor" stroke-width="1.8" stroke-dasharray="2.5 2.5"/></svg>`,
  users: `<svg viewBox="0 0 24 24" fill="none"><circle cx="9" cy="8" r="3.2" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 20c.7-3.6 3-5.5 5.5-5.5s4.8 1.9 5.5 5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M15.5 5.5c1.6.3 2.8 1.7 2.8 3.4 0 1.7-1.2 3.1-2.8 3.4M17.5 14.7c2 .5 3.4 2.2 4 4.9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>`,
  logout: `<svg viewBox="0 0 24 24" fill="none"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M16 17l5-5-5-5M21 12H9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  alloc: `<svg viewBox="0 0 24 24" fill="none"><path d="M4 7l8-4 8 4-8 4-8-4z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M4 12l8 4 8-4M4 17l8 4 8-4" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>`,

/* ---------------- State ---------------- */
let state = {
  users: [],
  locks: [],
  routes: [],
  allocations: [],
  currentUser: null,
  loading: true,
  activeTab: 'dashboard',
  filters: { status:'all', destination:'all', agency:'all', search:'' },
  masterFilters: { search:'' },
  allocFilters: { search:'', destination:'all' },
  selected: new Set(),
  modal: null,
  exportMenuOpen: null,
  toasts: [],
  loginError: '',
};

/* ---------------- Storage helpers ----------------
   Prefers window.storage (syncs across everyone using this file inside
   Claude's artifact panel). If that API isn't present — e.g. the file was
   downloaded and opened directly in a browser, or hosted elsewhere — it
   falls back to the browser's own localStorage so uploads still survive
   a refresh or logout/login. localStorage in that fallback case is only
   local to that one browser, not shared between different computers. */
const LS_PREFIX = 'sealtrack_';
const hasCloudStorage = () => (typeof window !== 'undefined' && !!window.storage && typeof window.storage.get === 'function');

async function storageGet(key){
  if(hasCloudStorage()){
    try{
      const r = await window.storage.get(key, true);
      return r ? JSON.parse(r.value) : null;
    }catch(e){ return null; } // key not yet created
  }
  try{
    const v = localStorage.getItem(LS_PREFIX + key);
    return v ? JSON.parse(v) : null;
  }catch(e){ return null; }
}
async function storageSet(key, val){
  if(hasCloudStorage()){
    try{
      await window.storage.set(key, JSON.stringify(val), true);
      return true;
    }catch(e){
      // fall through and try a local backup so the edit isn't lost
    }
  }
  try{
    localStorage.setItem(LS_PREFIX + key, JSON.stringify(val));
    return true;
  }catch(e){
    pushToast('Could not save changes — your browser storage may be full or blocked.', 'err');
    return false;
  }
}

function genId(prefix){
  return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}

function nowStamp(){
  const d = new Date();
  return d.toISOString();
}
function fmtDate(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  if(isNaN(d)) return '—';
  return d.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}) + ' ' + d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});
}

/* ---------------- Init / defaults ---------------- */
async function initApp(){
  let users = await storageGet('st:users');
  if(!users || !Array.isArray(users) || users.length === 0){
    users = [{ id: genId('u'), username:'admin', password:'admin123', role:'admin', destination:null, createdAt: nowStamp() }];
    await storageSet('st:users', users);
  }
  let locks = await storageGet('st:locks');
  if(!locks) locks = [];
  let routes = await storageGet('st:routes');
  if(!routes) routes = [];

  state.users = users;
  state.locks = locks;
  let allocations = await storageGet('st:allocations');
  if(!allocations || !Array.isArray(allocations)) allocations = [];
  state.allocations = allocations;
  state.routes = routes;
  state.loading = false;
  render();
}

/* ---------------- Toasts ---------------- */
function pushToast(msg, type){
  const id = genId('t');
  state.toasts.push({id, msg, type: type||'ok'});
  renderToastsOnly();
  setTimeout(()=>{
    state.toasts = state.toasts.filter(t=>t.id!==id);
    renderToastsOnly();
  }, 3200 + (msg.length>90 ? 3800 : 0));
}
function renderToastsOnly(){
  const el = document.getElementById('toastStack');
  if(!el) return;
  el.innerHTML = state.toasts.map(t=>`<div class="toast ${t.type==='err'?'err':(t.type==='ok'?'ok':'')}">${escapeHtml(t.msg)}</div>`).join('');
}

/* ---------------- Utils ---------------- */
function escapeHtml(s){
  if(s===null||s===undefined) return '';
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function distinctList(arr, key){
  const set = new Set();
  arr.forEach(x=>{ if(x[key] && String(x[key]).trim()) set.add(String(x[key]).trim()); });
  return Array.from(set).sort((a,b)=>a.localeCompare(b));
}
function allDestinations(){
  const set = new Set();
  state.routes.forEach(r=>r.destination && set.add(r.destination));
  state.locks.forEach(l=>l.destination && set.add(l.destination));
  state.users.forEach(u=>u.destination && set.add(u.destination));
  state.allocations.forEach(a=>a.destination && set.add(a.destination));
  return Array.from(set).sort((a,b)=>a.localeCompare(b));
}
function allOrigins(){
  const set = new Set();
  state.routes.forEach(r=>r.origin && set.add(r.origin));
  state.allocations.forEach(a=>a.origin && set.add(a.origin));
  return Array.from(set).sort((a,b)=>a.localeCompare(b));
}
function allAgencies(){
  const set = new Set();
  state.routes.forEach(r=>r.agency && set.add(r.agency));
  state.locks.forEach(l=>l.agency && set.add(l.agency));
  state.allocations.forEach(a=>a.agency && set.add(a.agency));
  return Array.from(set).sort((a,b)=>a.localeCompare(b));
}
function visibleLocksBase(){
  // scope by role
  if(state.currentUser && state.currentUser.role === 'destination'){
    return state.locks.filter(l => l.destination === state.currentUser.destination);
  }
  return state.locks;
}
function applyFilters(list){
  const f = state.filters;
  return list.filter(l=>{
    if(f.status !== 'all' && l.status !== f.status) return false;
    if(f.destination !== 'all' && l.destination !== f.destination) return false;
    if(f.agency !== 'all' && l.agency !== f.agency) return false;
    if(f.search){
      const s = f.search.toLowerCase();
      const hay = [l.lockNo,l.agency,l.plate,l.origin,l.destination].join(' ').toLowerCase();
      if(!hay.includes(s)) return false;
    }
    return true;
  });
}

/* ---------------- Render root ---------------- */
function render(){
  const active = document.activeElement;
  const activeId = active && active.id;
  const selStart = (active && typeof active.selectionStart === 'number') ? active.selectionStart : null;
  const selEnd = (active && typeof active.selectionEnd === 'number') ? active.selectionEnd : null;

  const app = document.getElementById('app');
  if(state.loading){
    app.innerHTML = `<div class="login-wrap"><div style="color:#fff;font-family:var(--font-display);font-size:15px;">Loading SPX Truck Lock GPS…</div></div>`;
    return;
  }
  if(!state.currentUser){
    app.innerHTML = renderLogin();
  } else {
    app.innerHTML = renderShell();
  }
  app.insertAdjacentHTML('beforeend', `<div class="toast-stack" id="toastStack">${state.toasts.map(t=>`<div class="toast ${t.type==='err'?'err':''}">${escapeHtml(t.msg)}</div>`).join('')}</div>`);

  if(activeId){
    const el = document.getElementById(activeId);
    if(el){
      el.focus();
      if(selStart!==null && el.setSelectionRange){
        try{ el.setSelectionRange(selStart, selEnd); }catch(e){}
      }
    }
  }
}

/* ---------------- Login screen ---------------- */
function renderLogin(){
  return `
  <div class="login-wrap">
    <div class="login-card">
      <div class="brand-mark">${ICONS.seal}<span class="brand-name">SPX Truck Lock GPS</span></div>
      <p class="brand-sub">GPS Truck Lock tracking &amp; chain-of-custody</p>
      ${state.loginError ? `<div class="login-error">${escapeHtml(state.loginError)}</div>` : ''}
      <form onsubmit="handleLogin(event)">
        <div class="field">
          <label for="loginUser">Username</label>
          <input id="loginUser" name="username" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="loginPass">Password</label>
          <input id="loginPass" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block login-btn">Log in</button>
      </form>
      <div class="login-hint">First time here? Default admin login is <b>admin / admin123</b>. Sign in and change the password from Settings → your account.</div>
    </div>
  </div>`;
}

function handleLogin(e){
  e.preventDefault();
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  const match = state.users.find(x=>x.username.toLowerCase() === u.toLowerCase() && x.password === p);
  if(!match){
    state.loginError = 'Incorrect username or password.';
    render();
    return;
  }
  state.loginError = '';
  state.currentUser = match;
  state.activeTab = 'dashboard';
  state.filters = { status:'all', destination: match.role==='destination'? match.destination : 'all', agency:'all', search:'' };
  render();
  pushToast(`Welcome back, ${match.username}.`, 'ok');
}

function handleLogout(){
  state.currentUser = null;
  state.selected = new Set();
  render();
}

/* ---------------- Shell (post-login) ---------------- */
function renderShell(){
  const isAdmin = state.currentUser.role === 'admin';
  const tabs = [
    {id:'dashboard', label:'Dashboard', icon:ICONS.dash},

  return `
  <div class="shell">
    <div class="sidebar">
      <div class="sb-brand">${ICONS.seal}<span class="sb-brand-text">SPX Truck Lock GPS</span></div>

        <button class="nav-item ${state.activeTab===t.id?'active':''}" onclick="setTab('${t.id}')">${t.icon}<span>${t.label}</span></button>

function setTab(tab){
  state.activeTab = tab;
  state.selected = new Set();
  state.exportMenuOpen = null;
  render();
}

function renderTab(){
  switch(state.activeTab){
    case 'dashboard': return renderDashboard();
    case 'locks': return renderLocksTab();
    case 'allocation': return renderAllocationTab();
    case 'master': return renderMasterTab();
    case 'settings': return renderSettingsTab();
    case 'account': return renderAccountTab();
    default: return renderDashboard();
  }
}

/* ---------------- Dashboard ---------------- */
function renderDashboard(){
  const isAdmin = state.currentUser.role === 'admin';
  const scoped = visibleLocksBase();
  const total = scoped.length;
  const available = scoped.filter(l=>l.status==='available').length;
  const assigned = scoped.filter(l=>l.status==='assigned').length;
  const received = scoped.filter(l=>l.status==='received').length;
  const returning = scoped.filter(l=>l.status==='returning').length;

  // One card per destination for a given status, with an agency breakdown.
  const cardsFor = (status, cls) => {
    const map = new Map();
    scoped.filter(l=>l.status===status && l.destination).forEach(l=>{
      if(!map.has(l.destination)) map.set(l.destination, {d:l.destination, n:0, agencies:new Map()});
      const g = map.get(l.destination);
      g.n++;
      const ag = l.agency || '—';
      g.agencies.set(ag, (g.agencies.get(ag)||0) + 1);
    });
    return Array.from(map.values()).sort((x,y)=>y.n-x.n || x.d.localeCompare(y.d)).map(g=>`
      <div class="stat-card ${cls}">
        <div class="stat-label">${escapeHtml(g.d)}</div>
        <div class="stat-value">${g.n}</div>
        <div class="stat-breakdown">
          ${Array.from(g.agencies.entries()).sort((x,y)=>y[1]-x[1] || x[0].localeCompare(y[0])).map(([ag,n])=>`<span><em>${escapeHtml(ag)}</em><b>${n}</b></span>`).join('')}
        </div>
      </div>`);
  };
  // Assigned Destination: in-transit locks plus allocated locks not assigned yet (still usable).
  const aMap = new Map();
  const aGet = (d)=>{ if(!aMap.has(d)) aMap.set(d,{d, n:0, left:0, ag:new Map()}); return aMap.get(d); };
  const agGet = (g,name)=>{ if(!g.ag.has(name)) g.ag.set(name,{n:0,left:0}); return g.ag.get(name); };
  scoped.filter(l=>l.status==='assigned' && l.destination).forEach(l=>{
    const g = aGet(l.destination); g.n++; agGet(g, l.agency||'—').n++;
  });
  state.allocations.filter(a=>isAdmin || a.destination===state.currentUser.destination).forEach(a=>{
    const left = Math.max(a.qty - allocUsedCount(a.destination, a.agency), 0);
    const g = aGet(a.destination); g.left += left; agGet(g, a.agency).left += left;
  });
  const assignedCards = Array.from(aMap.values()).filter(g=>g.n>0 || g.left>0)
    .sort((x,y)=>y.n-x.n || y.left-x.left || x.d.localeCompare(y.d)).map(g=>`
      <div class="stat-card c-assigned">
        <div class="stat-label">${escapeHtml(g.d)}</div>
        <div class="stat-value">${g.n}</div>
        <div class="stat-sub">in-transit</div>
        <div class="stat-extra"><span>Not assigned (still usable)</span><b>${g.left}</b></div>
        <div class="stat-breakdown">
          ${Array.from(g.ag.entries()).sort((x,y)=>y[1].n-x[1].n || x[0].localeCompare(y[0])).map(([name,v])=>`<span><em>${escapeHtml(name)}</em><b>${v.n} in-transit · ${v.left} left</b></span>`).join('')}
        </div>
      </div>`);
  const receivedCards = cardsFor('received','c-received');

  return `
    <div class="topbar">
      <div>
        <h1 class="page-title">Dashboard</h1>
        <p class="page-sub">${isAdmin? 'Fleet-wide overview of every truck lock.' : `Overview for ${escapeHtml(state.currentUser.destination||'')}.`}</p>
      </div>
    </div>
    <div class="grid-cards">
      <div class="stat-card c-total"><div class="stat-label">Total Locks</div><div class="stat-value">${total}</div></div>
      <div class="stat-card c-available"><div class="stat-label">Available</div><div class="stat-value">${available}</div></div>
      <div class="stat-card c-assigned"><div class="stat-label">Assigned / In-transit</div><div class="stat-value">${assigned}</div></div>
      <div class="stat-card c-received"><div class="stat-label">Received / Complete</div><div class="stat-value">${received}</div></div>
      <div class="stat-card c-returning"><div class="stat-label">Returning to Origin</div><div class="stat-value">${returning}</div></div>
    </div>
    <div class="panel" style="margin-bottom:20px;">
      <p class="panel-title">Assigned Destination</p>
      <p class="panel-sub">Truck locks in-transit to each destination, plus the allocated locks not yet assigned (still usable). Once a destination receives a lock, it moves to Received Destination below.</p>
      ${assignedCards.length ? `<div class="dest-stat-grid">${assignedCards.join('')}</div>` : `<p class="helper-text">No locks in-transit right now.</p>`}
    </div>
    <div class="panel">
      <p class="panel-title">Received Destination</p>
      <p class="panel-sub">All locks received by each destination.</p>
      ${receivedCards.length ? `<div class="dest-stat-grid">${receivedCards.join('')}</div>` : `<p class="helper-text">No locks received yet.</p>`}
    </div>
  `;
}

function statusBadge(status){
  if(status==='available') return `<span class="badge badge-available">Available</span>`;
  if(status==='assigned') return `<span class="badge badge-assigned">In-transit</span>`;
  if(status==='received') return `<span class="badge badge-received">Received</span>`;
  if(status==='returning') return `<span class="badge badge-returning">Returning to origin</span>`;
  return `<span class="badge">${escapeHtml(status)}</span>`;
}
function emptyState(title, sub){
  return `<div class="empty-state">${ICONS.empty}<h4>${escapeHtml(title)}</h4><p>${escapeHtml(sub)}</p></div>`;
}

        ${isAdmin ? `

          <option value="all" ${state.filters.destination==='all'?'selected':''}>All destinations</option>
          ${dests.map(d=>`<option value="${escapeHtml(d)}" ${state.filters.destination===d?'selected':''}>${escapeHtml(d)}</option>`).join('')}

                    ${(l.status==='assigned'||l.status==='received') && (isAdmin || l.destination===state.currentUser.destination) ? `<button class="btn btn-accent btn-sm" onclick="returnToOrigin('${l.id}')">Return to origin</button>` : ''}
                    ${isAdmin && l.status==='returning' ? `<button class="btn btn-success btn-sm" onclick="arriveAtOrigin('${l.id}')">Back at origin</button>` : ''}
                    ${isAdmin && l.status!=='available' ? `<button class="btn btn-ghost btn-sm" onclick="unassignLock('${l.id}')">Release</button>` : ''}
                    ${isAdmin ? `<button class="btn btn-ghost btn-sm" onclick="openModal('editLock', ['${l.id}'])">Edit</button>` : ''}
                    ${isAdmin ? `<button class="btn btn-danger btn-sm" onclick="deleteLock('${l.id}')">Delete</button>` : ''}
                  </div>

            `).join('')}

/* ---------------- Lock actions ---------------- */
async function markReceived(id){
  const lock = state.locks.find(l=>l.id===id);
  if(!lock) return;
  lock.status = 'received';
  lock.receivedAt = nowStamp();
  await storageSet('st:locks', state.locks);
  pushToast(`Lock ${lock.lockNo} marked as received.`, 'ok');
  render();
}
async function bulkMarkReceived(){
  let n=0;
  state.locks.forEach(l=>{
    if(state.selected.has(l.id) && l.status==='assigned'){
      l.status='received'; l.receivedAt = nowStamp(); n++;
    }
  });
  await storageSet('st:locks', state.locks);
  state.selected = new Set();
  pushToast(`${n} lock(s) marked as received.`, 'ok');
  render();
}
function canReturnLock(l){
  if(!l || (l.status!=='assigned' && l.status!=='received')) return false;
  return state.currentUser.role==='admin' || l.destination===state.currentUser.destination;
}
async function returnToOrigin(id){
  const l = state.locks.find(x=>x.id===id);
  if(!canReturnLock(l)){ pushToast("This lock can't be returned to origin.", 'err'); return; }
  if(!confirm(`Send lock ${l.lockNo} back to its origin (${l.origin||'—'})?`)) return;
  Object.assign(l, {status:'returning', returnStartedAt: nowStamp()});
  await storageSet('st:locks', state.locks);
  pushToast(`Lock ${l.lockNo} is returning to ${l.origin||'its origin'}.`, 'ok');
  render();
}
async function bulkReturnToOrigin(){
  const sel = state.locks.filter(l=>state.selected.has(l.id));
  if(!sel.length || !sel.every(canReturnLock)){ pushToast("Some selected locks can't be returned to origin.", 'err'); return; }
  if(!confirm(`Send ${sel.length} lock(s) back to their origin?`)) return;
  const stamp = nowStamp();
  sel.forEach(l=>Object.assign(l,{status:'returning', returnStartedAt:stamp}));
  await storageSet('st:locks', state.locks);
  state.selected = new Set();
  pushToast(`${sel.length} lock(s) returning to origin.`, 'ok');
  render();
}
function backToStock(l){
  // Back at origin: lock is available stock again. A reservation to an allocation stays in place.
  Object.assign(l, {status:'available', agency:'', plate:'', origin:'', destination:'', assignedAt:null, receivedAt:null, returnStartedAt:null});
}
async function arriveAtOrigin(id){
  const l = state.locks.find(x=>x.id===id);
  if(!l || l.status!=='returning') return;
  backToStock(l);
  await storageSet('st:locks', state.locks);
  pushToast(`Lock ${l.lockNo} is back at origin and available.`, 'ok');
  render();
}
async function bulkArriveAtOrigin(){
  const sel = state.locks.filter(l=>state.selected.has(l.id) && l.status==='returning');
  if(!sel.length) return;
  sel.forEach(backToStock);
  await storageSet('st:locks', state.locks);
  state.selected = new Set();
  pushToast(`${sel.length} lock(s) are back at origin and available.`, 'ok');
  render();
}
async function unassignLock(id){
  const lock = state.locks.find(l=>l.id===id);
  if(!lock) return;
  if(!confirm(`Release lock ${lock.lockNo} to Available? This clears its assignment.`)) return;
  Object.assign(lock, {status:'available', agency:'', plate:'', origin:'', destination:'', assignedAt:null, receivedAt:null});
  await storageSet('st:locks', state.locks);
  pushToast(`Lock ${lock.lockNo} released to available.`, 'ok');
  render();
}
async function bulkUnassign(){
  if(!confirm(`Release ${state.selected.size} lock(s) to Available?`)) return;
  state.locks.forEach(l=>{
    if(state.selected.has(l.id)){
      Object.assign(l, {status:'available', agency:'', plate:'', origin:'', destination:'', assignedAt:null, receivedAt:null});
    }
  });
  await storageSet('st:locks', state.locks);
  state.selected = new Set();
  pushToast('Selected locks released to available.', 'ok');
  render();
}
async function deleteLock(id){
  const lock = state.locks.find(l=>l.id===id);
  if(!lock) return;
  if(!confirm(`Delete lock ${lock.lockNo} permanently?`)) return;
  state.locks = state.locks.filter(l=>l.id!==id);
  await storageSet('st:locks', state.locks);
  pushToast('Lock deleted.', 'ok');
  render();
}
async function bulkDeleteLocks(){
  if(!confirm(`Delete ${state.selected.size} lock(s) permanently?`)) return;
  state.locks = state.locks.filter(l=>!state.selected.has(l.id));
  await storageSet('st:locks', state.locks);
  state.selected = new Set();
  pushToast('Selected locks deleted.', 'ok');
  render();
}

async function submitBulkLocks(){
  const fileInput = document.getElementById('bulkLockFile');
  const text = document.getElementById('bulkLockText').value;
  let numbers = [];

  if(fileInput && fileInput.files && fileInput.files[0]){
    try{
      numbers = await extractLockNumbersFromFile(fileInput.files[0]);
    }catch(e){
      pushToast('Could not read that file. Please check the format.', 'err');
      return;
    }
  }
  if(text.trim()){
    text.split(/[\n,]+/).map(s=>s.trim()).filter(Boolean).forEach(n=>numbers.push(n));
  }
  numbers = Array.from(new Set(numbers.map(n=>n.trim()).filter(Boolean)));

  if(numbers.length===0){
    pushToast('No lock numbers found to upload.', 'err');
    return;
  }
  const existing = new Set(state.locks.map(l=>l.lockNo.toLowerCase()));
  let added=0, skipped=0;
  numbers.forEach(n=>{
    if(existing.has(n.toLowerCase())){ skipped++; return; }
    state.locks.push({
      id: genId('lk'), lockNo: n, status:'available',
      agency:'', plate:'', origin:'', destination:'',
      assignedAt:null, receivedAt:null, createdAt: nowStamp()
    });
    existing.add(n.toLowerCase());
    added++;
  });
  await storageSet('st:locks', state.locks);
  closeModal();
  pushToast(`${added} lock(s) added.${skipped? ' '+skipped+' duplicate(s) skipped.':''}`, 'ok');
}

function extractLockNumbersFromFile(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      try{
        const wb = XLSX.read(e.target.result, {type:'array'});
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, {defval:''});
        if(rows.length===0){ resolve([]); return; }
        const headerKeys = Object.keys(rows[0]);
        const candidates = ['lock no','lock number','gps lock no','gps lock number','gps truck lock','serial no','serial number','lock','id'];
        let col = headerKeys.find(h => candidates.includes(String(h).trim().toLowerCase()));
        if(!col) col = headerKeys[0];
        const vals = rows.map(r=>String(r[col]||'').trim()).filter(Boolean);
        resolve(vals);
      }catch(err){ reject(err); }
    };
    reader.onerror = reject;
    reader.readAsArrayBuffer(file);
  });
}

  document.getElementById('assignAgency').value = a ? a.agency : '';

  const plates = a ? state.routes.filter(r=>r.plate && allocKey('',r.agency)===allocKey('',a.agency)).map(r=>r.plate) : [];

async function submitAssign(ids){
  const allocId = document.getElementById('assignAlloc').value;
  const plate = document.getElementById('assignPlate').value.trim();
  const alloc = state.allocations.find(x=>x.id===allocId);
  if(!alloc){ pushToast('Select an allocation.', 'err'); return; }
  if(!plate){ pushToast('Enter the truck plate no.', 'err'); return; }
  if(!alloc.origin){ pushToast(`${alloc.agency} → ${alloc.destination} has no origin. Edit the allocation first.`, 'err'); return; }
  const origin = alloc.origin;
  // Locks already allocated cannot be re-allocated elsewhere.
  const locked = state.locks.filter(l=>ids.includes(l.id) && l.status!=='available');
  if(locked.length){
    pushToast(`${locked.length} selected lock(s) are already allocated to a destination/agency and cannot be reallocated. They can only be returned to their origin (or released first).`, 'err');
    return;
  }
  const used = allocUsedCount(alloc.destination, alloc.agency);
  const left = alloc.qty - used;
  if(ids.length > left){
    pushToast(`Exceeds allocation: ${alloc.agency} → ${alloc.destination} has ${Math.max(left,0)} lock(s) left (${used}/${alloc.qty} used), you selected ${ids.length}.`, 'err');
    return;
  }
  // A lock number listed under another allocation can't go to this one.
  const sel = state.locks.filter(l=>ids.includes(l.id));
  const clash = sel.find(l=>{ const r = reservationOf(l.id); return r && r.id!==alloc.id; });
  if(clash){
    const r = reservationOf(clash.id);
    pushToast(`Lock ${clash.lockNo} is allocated to ${r.agency} → ${r.destination} and can't be assigned elsewhere.`, 'err');
    return;
  }
  // Slots reserved for specific lock numbers can't be taken by other locks.
  const reservedHere = sel.filter(l=>{ const r = reservationOf(l.id); return r && r.id===alloc.id; }).length;
  const others = ids.length - reservedHere;
  const freeUnreserved = alloc.qty - used - allocPendingReserved(alloc);
  if(others > freeUnreserved){
    pushToast(`Only ${Math.max(freeUnreserved,0)} unreserved slot(s) left in ${alloc.agency} → ${alloc.destination}. The rest are reserved for specific lock numbers listed in the Allocation tab.`, 'err');
    return;
  }
  const stamp = nowStamp();
  state.locks.forEach(l=>{
    if(ids.includes(l.id)){
      Object.assign(l, {agency: alloc.agency, plate, origin, destination: alloc.destination, status:'assigned', assignedAt: stamp, receivedAt:null});
    }
  });
  await storageSet('st:locks', state.locks);
  state.selected = new Set();
  closeModal();
  pushToast(`${ids.length} lock(s) assigned to ${alloc.agency} → ${alloc.destination} (${used+ids.length}/${alloc.qty}).`, 'ok');
}

function downloadRouteTemplate(){

  XLSX.utils.book_append_sheet(wb, ws, 'Template');

async function submitBulkRoutes(){
  const fileInput = document.getElementById('bulkRouteFile');
  if(!fileInput.files || !fileInput.files[0]){ pushToast('Please choose a file to upload.', 'err'); return; }
  try{
    const rows = await extractRowsFromFile(fileInput.files[0]);
    if(rows.length===0){ pushToast('No rows found in that file.', 'err'); return; }
    const headerMap = mapHeaders(Object.keys(rows[0]), {
      agency:['agency','agency name'],
      plate:['plate','plate no','plate number','truck plate','plate #'],
      origin:['origin','from','origin point'],
      destination:['destination','to','dest']
    });
    let added=0;
    rows.forEach(row=>{
      const agency = String(row[headerMap.agency]||'').trim();
      const plate = String(row[headerMap.plate]||'').trim();
      const origin = String(row[headerMap.origin]||'').trim();
      const destination = String(row[headerMap.destination]||'').trim();
      if(!agency && !plate && !origin && !destination) return;
      state.routes.push({id: genId('rt'), agency, plate, origin, destination, createdAt: nowStamp()});
      added++;
    });
    await storageSet('st:routes', state.routes);
    closeModal();
    pushToast(`${added} route(s) added to master data.`, 'ok');
  }catch(e){
    pushToast('Could not read that file. Please check the format.', 'err');
  }
}
function mapHeaders(headers, wanted){
  const lower = headers.map(h=>String(h).trim().toLowerCase());
  const result = {};
  Object.keys(wanted).forEach(key=>{
    let idx = -1;
    for(const cand of wanted[key]){
      idx = lower.indexOf(cand);
      if(idx>-1) break;
    }
    result[key] = idx>-1 ? headers[idx] : headers[0];
  });
  return result;
}
function extractRowsFromFile(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      try{
        const wb = XLSX.read(e.target.result, {type:'array'});
        const sheet = wb.Sheets[wb.SheetNames[0]];
        resolve(XLSX.utils.sheet_to_json(sheet, {defval:''}));
      }catch(err){ reject(err); }
    };
    reader.onerror = reject;
    reader.readAsArrayBuffer(file);
  });
}

function exportData(scope, format){
  state.exportMenuOpen = null;
  let rows = [];
  let filename = 'spx_truck_lock_gps_export';
  if(scope === 'locks'){
    const base = visibleLocksBase();
    const list = applyFilters(base);
    rows = list.map(l=>({
      'Lock No': l.lockNo,
      'Status': ({available:'Available',assigned:'In-transit',received:'Received',returning:'Returning to origin'})[l.status]||l.status,
      'Agency': l.agency||'',
      'Plate No': l.plate||'',
      'Origin': l.origin||'',
      'Destination': l.destination||'',
      'Assigned Date': l.assignedAt ? fmtDate(l.assignedAt) : '',
      'Received Date': l.receivedAt ? fmtDate(l.receivedAt) : ''
    }));
    filename = 'gps_locks_export';
  } else if(scope === 'routes'){
    rows = state.routes.map(r=>({Agency:r.agency, Plate:r.plate, Origin:r.origin, Destination:r.destination}));
    filename = 'master_route_list';
  }
  if(scope === 'allocation'){
    const out = [];
    buildAllocationRows().forEach(r=>{
      out.push({
        'Origin': r.origin||'', 'Destination': r.destination, 'Agency': r.agency,
        'Lock Qty Allocated': r.qty===null ? '' : r.qty,
        'Locks Assigned': r.locks.length,
        'Balance': r.qty===null ? '' : r.qty - r.locks.length,
        'Lock Numbers': r.all.map(l=>l.lockNo).join(', '),
        'Reserved (not assigned)': r.reserved.map(l=>l.lockNo).join(', ')
      });
    });
    rows = out; filename = 'allocation_export';
  }
  if(rows.length===0){
    pushToast('Nothing to export yet.', 'err');
    render();
    return;
  }
  const ws = XLSX.utils.json_to_sheet(rows);
  if(format==='xlsx'){
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Data');
    XLSX.writeFile(wb, filename + '.xlsx');
  } else {
    const csv = XLSX.utils.sheet_to_csv(ws);
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename + '.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
  pushToast('Export ready — check your downloads.', 'ok');
  render();
}

/* ---------------- Allocation module ---------------- */
function allocKey(d,a){ return (d||'').trim().toLowerCase() + '||' + (a||'').trim().toLowerCase(); }
function findAllocation(dest, agency){
  return state.allocations.find(a=>allocKey(a.destination,a.agency)===allocKey(dest,agency)) || null;
}
function lockById(id){ return state.locks.find(l=>l.id===id); }
function allocLocks(a){ return (a.lockIds||[]).map(lockById).filter(Boolean); }
function allocUsedCount(dest, agency){
  const k = allocKey(dest,agency);
  return state.locks.filter(l=>(l.status==='assigned'||l.status==='received'||l.status==='returning') && allocKey(l.destination,l.agency)===k).length;
}
function reservationOf(lockId){ return state.allocations.find(a=>(a.lockIds||[]).includes(lockId)) || null; }
function allocPendingReserved(a){ return allocLocks(a).filter(l=>l.status==='available').length; }
function allocBalanceList(){
  return state.allocations.map(a=>({a, left: a.qty - allocUsedCount(a.destination,a.agency), pending: allocPendingReserved(a)}))
    .sort((x,y)=>x.a.destination.localeCompare(y.a.destination)||x.a.agency.localeCompare(y.a.agency));
}
function parseLockNos(text){
  const seen = new Set(), out = [];
  String(text==null?'':text).split(/[\n\r,;\t]+/).map(x=>x.trim()).filter(Boolean).forEach(n=>{
    const k = n.toLowerCase(); if(!seen.has(k)){ seen.add(k); out.push(n); }
  });
  return out;
}
// Resolve lock numbers against GPS Locks stock and make sure they can belong to this destination + agency.
function resolveLockNos(nos, destination, agency, excludeAllocId){
  const ids = [], errors = [], seen = new Set();
  const pairKey = allocKey(destination, agency);
  nos.forEach(no=>{
    const l = state.locks.find(x=>String(x.lockNo).toLowerCase()===no.toLowerCase());
    if(!l){ errors.push(`${no}: not found in Truck Lock Assigning`); return; }
    if(seen.has(l.id)) return;
    seen.add(l.id);
    if(l.status!=='available' && allocKey(l.destination,l.agency)!==pairKey){
      errors.push(`${no}: already assigned to ${l.agency} → ${l.destination}`); return;
    }
    const r = reservationOf(l.id);
    if(r && r.id!==excludeAllocId && allocKey(r.destination,r.agency)!==pairKey){
      errors.push(`${no}: already allocated to ${r.agency} → ${r.destination}`); return;
    }
    ids.push(l.id);
  });
  return {ids, errors};
}
function errSummary(errors){
  return errors.slice(0,3).join('; ') + (errors.length>3 ? ` (+${errors.length-3} more)` : '');
}

function buildAllocationRows(){
  const isAdmin = state.currentUser.role === 'admin';
  const map = new Map();
  state.allocations.forEach(a=>{
    map.set(allocKey(a.destination,a.agency), {allocId:a.id, origin:a.origin||'', destination:a.destination, agency:a.agency, qty:a.qty,
      locks:[], reserved: allocLocks(a).filter(l=>l.status==='available')});
  });
  state.locks.forEach(l=>{
    if(!l.destination || !l.agency) return;
    if(l.status!=='assigned' && l.status!=='received' && l.status!=='returning') return;
    const k = allocKey(l.destination,l.agency);
    if(!map.has(k)) map.set(k, {allocId:null, origin:'', destination:l.destination, agency:l.agency, qty:null, locks:[], reserved:[]});
    map.get(k).locks.push(l);
  });
  let rows = Array.from(map.values());
  if(!isAdmin) rows = rows.filter(r=>r.destination===state.currentUser.destination);
  const f = state.allocFilters;
  if(f.destination!=='all') rows = rows.filter(r=>r.destination===f.destination);
  const byNo = (a,b)=>a.lockNo.localeCompare(b.lockNo,undefined,{numeric:true});
  rows.forEach(r=>{ r.locks.sort(byNo); r.reserved.sort(byNo); r.all = [...r.locks, ...r.reserved].sort(byNo); });
  if(f.search){
    const q = f.search.toLowerCase();
    rows = rows.filter(r=>((r.origin||'')+' '+r.destination+' '+r.agency+' '+r.all.map(l=>l.lockNo).join(' ')).toLowerCase().includes(q));
  }
  return rows.sort((a,b)=>a.destination.localeCompare(b.destination) || a.agency.localeCompare(b.agency));
}

      <div class="table-toolbar">
        <div class="grow"><input id="allocSearch" class="search-input" placeholder="Search destination, agency or lock no…" value="${escapeHtml(state.allocFilters.search)}" oninput="updateAllocFilter('search', this.value)"></div>
        ${isAdmin ? `<select class="filter-select" onchange="updateAllocFilter('destination', this.value)">
          <option value="all">All destinations</option>
          ${dests.map(d=>`<option value="${escapeHtml(d)}" ${state.allocFilters.destination===d?'selected':''}>${escapeHtml(d)}</option>`).join('')}
        </select>` : ''}
      </div>
      <p class="helper-text" style="margin:-4px 0 12px;">Solid lock numbers are assigned (in-transit / received). Dashed ones are reserved for this allocation but not assigned yet.</p>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Origin</th><th>Destination</th><th>Agency</th><th>Lock Qty Allocated</th><th>Assigned</th><th>Balance</th><th>Lock Numbers</th>${isAdmin?'<th>Actions</th>':''}</tr></thead>
          <tbody>
            ${rows.length===0 ? `<tr class="empty-row"><td colspan="${isAdmin?8:7}">${emptyState('No allocations yet', isAdmin ? 'Add an allocation (with lock numbers) or assign locks to a destination and agency.' : 'Nothing is allocated to your destination yet.')}</td></tr>` : rows.map(r=>{
              const n = r.locks.length;
              const hasQ = r.qty!==null;
              const bal = hasQ ? r.qty - n : null;
              const pct = hasQ && r.qty>0 ? Math.min(100, Math.round(n/r.qty*100)) : (n>0?100:0);
              const balCls = !hasQ ? '' : (bal<0 ? 'bal-over' : (bal===0 ? 'bal-low' : 'bal-ok'));
              const dEnc = encodeURIComponent(r.destination), aEnc = encodeURIComponent(r.agency);
              const total = r.all.length;
              const viewBtn = `<button class="chip-more" onclick="openModal('viewAllocLocks',[decodeURIComponent('${dEnc}'),decodeURIComponent('${aEnc}')])">${total>MAXCHIPS ? '+'+(total-MAXCHIPS)+' more' : 'View'}</button>`;
              return `<tr>
                <td>${r.origin ? escapeHtml(r.origin) : '<span class="helper-text">—</span>'}</td>
                <td><b>${escapeHtml(r.destination)}</b></td>
                <td>${escapeHtml(r.agency)}</td>
                <td>${hasQ ? `<span class="qty-num">${r.qty}</span>` : `<span class="badge badge-noquota">No quota set</span>`}</td>
                <td><span class="qty-num">${n}</span>${hasQ?`<div class="prog ${bal<0?'over':''}"><div style="width:${pct}%"></div></div>`:''}${r.reserved.length?`<div class="helper-text">${r.reserved.length} reserved</div>`:''}</td>
                <td>${hasQ ? `<span class="qty-num ${balCls}">${bal}</span>${bal<0?' <span class="helper-text">over</span>':''}` : '—'}</td>
                <td>${total===0 ? '<span class="helper-text">None listed</span>' : `<div class="alloc-lock-chips">
                  ${r.all.slice(0,MAXCHIPS).map(l=>{ const res = l.status==='available'; return `<span class="chip ${res?'chip-res':''}" title="${res?'Reserved — not assigned yet':(l.status==='received'?'Received':'In-transit')}">${escapeHtml(l.lockNo)}</span>`; }).join('')}
                  ${viewBtn}
                </div>`}</td>
                ${isAdmin ? `<td class="action-row">
                  ${r.allocId ? `<button class="btn btn-ghost btn-sm" onclick="openModal('editAlloc',['${r.allocId}'])">Edit</button><button class="btn btn-danger btn-sm" onclick="deleteAlloc('${r.allocId}')">Delete</button>`
                              : `<button class="btn btn-accent btn-sm" onclick="openModal('addAlloc',[decodeURIComponent('${dEnc}'),decodeURIComponent('${aEnc}')])">Set qty</button>`}
                </td>` : ''}
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>
    ${state.modal ? renderModal() : ''}
  `;
}
function updateAllocFilter(key,val){ state.allocFilters[key]=val; render(); }

/* --- Add / edit allocation (individual) --- */
function modalAddAlloc(){
  const preD = (state.modal.ids && state.modal.ids[0]) || '';
  const preA = (state.modal.ids && state.modal.ids[1]) || '';
  const body = `
    <div class="form-row">
      <div class="field"><label for="allocDest">Destination</label><input id="allocDest" list="allocDestList" placeholder="e.g. Cebu Warehouse" value="${escapeHtml(preD)}"><datalist id="allocDestList">${allDestinations().map(d=>`<option value="${escapeHtml(d)}">`).join('')}</datalist></div>
      <div class="field"><label for="allocAgency">Agency</label><input id="allocAgency" list="allocAgencyList" placeholder="e.g. Metro Freight" value="${escapeHtml(preA)}"><datalist id="allocAgencyList">${allAgencies().map(a=>`<option value="${escapeHtml(a)}">`).join('')}</datalist></div>
    </div>
    <div class="field"><label for="allocOrigin">Origin</label><input id="allocOrigin" list="allocOriginList" placeholder="e.g. Manila Port"><datalist id="allocOriginList">${allOrigins().map(o=>`<option value="${escapeHtml(o)}">`).join('')}</datalist>
      <div class="helper-text">Truck Lock Assigning looks up Agency, Origin and Destination from this allocation.</div></div>
    <div class="field"><label for="allocQty">Lock Qty Allocated</label><input id="allocQty" type="number" min="0" step="1" placeholder="Leave blank to use the number of lock numbers below"></div>
    <div class="field"><label for="allocLockNos">Lock numbers</label><textarea id="allocLockNos" rows="5" placeholder="GPS-000123&#10;GPS-000124&#10;(one per line or comma separated)"></textarea>
      <div class="helper-text">Must already exist as Available in Truck Lock Assigning. Added to any lock numbers this destination + agency already has.</div></div>
  `;
  const footer = `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-accent" onclick="submitAddAlloc()">Save allocation</button>`;
  return modalShell('Add allocation','Quantity and lock numbers for a destination and agency.', body, footer);
}
async function submitAddAlloc(){
  const destination = document.getElementById('allocDest').value.trim();
  const agency = document.getElementById('allocAgency').value.trim();
  const qtyRaw = document.getElementById('allocQty').value.trim();
  const origin = document.getElementById('allocOrigin').value.trim();
  const nos = parseLockNos(document.getElementById('allocLockNos').value);
  if(!destination || !agency || !origin){ pushToast('Enter origin, destination and agency.', 'err'); return; }
  const ex = findAllocation(destination, agency);
  const {ids, errors} = resolveLockNos(nos, destination, agency, ex?ex.id:null);
  if(errors.length){ pushToast('Lock number issue — ' + errSummary(errors), 'err'); return; }
  const existingIds = ex ? (ex.lockIds||[]).filter(id=>lockById(id)) : [];
  const merged = Array.from(new Set([...existingIds, ...ids]));
  let qty;
  if(qtyRaw===''){
    if(!ex && merged.length===0){ pushToast('Enter a quantity or at least one lock number.', 'err'); return; }
    qty = ex ? Math.max(ex.qty, merged.length) : merged.length;
  } else {
    qty = Number(qtyRaw);
    if(!Number.isInteger(qty) || qty<0){ pushToast('Enter a valid whole-number quantity.', 'err'); return; }
  }
  if(qty < merged.length){ pushToast(`Quantity ${qty} is less than the ${merged.length} lock number(s) listed.`, 'err'); return; }
  if(ex){
    const usedNow = allocUsedCount(ex.destination, ex.agency);
    if(qty < usedNow){ pushToast(`Cannot set below ${usedNow} — that many locks are already assigned.`, 'err'); return; }
    ex.qty = qty; ex.origin = origin; ex.lockIds = merged; ex.updatedAt = nowStamp();
    pushToast('Existing allocation updated.', 'ok');
  } else {
    state.allocations.push({id:genId('al'), origin, destination, agency, qty, lockIds: merged, createdAt: nowStamp()});
    pushToast('Allocation added.', 'ok');
  }
  await storageSet('st:allocations', state.allocations);
  closeModal();
}
function modalEditAlloc(id){
  const a = state.allocations.find(x=>x.id===id);
  if(!a) return '';
  const body = `
    <div class="form-row">
      <div class="field"><label for="allocDest">Destination</label><input id="allocDest" value="${escapeHtml(a.destination)}"></div>
      <div class="field"><label for="allocAgency">Agency</label><input id="allocAgency" value="${escapeHtml(a.agency)}"></div>
    </div>
    <div class="field"><label for="allocOrigin">Origin</label><input id="allocOrigin" list="allocOriginList" value="${escapeHtml(a.origin||'')}"><datalist id="allocOriginList">${allOrigins().map(o=>`<option value="${escapeHtml(o)}">`).join('')}</datalist></div>
    <div class="field"><label for="allocQty">Lock Qty Allocated</label><input id="allocQty" type="number" min="0" step="1" value="${a.qty}"></div>
    <div class="field"><label for="allocLockNos">Lock numbers</label><textarea id="allocLockNos" rows="6">${escapeHtml(allocLocks(a).map(l=>l.lockNo).join('\n'))}</textarea>
      <div class="helper-text">This is the full list. Remove a line to release a lock number (only if it isn't assigned yet).</div></div>
  `;
  const footer = `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-accent" onclick="submitEditAlloc('${id}')">Save changes</button>`;
  return modalShell('Edit allocation','Update destination, agency, quantity or lock numbers.', body, footer);
}
async function submitEditAlloc(id){
  const a = state.allocations.find(x=>x.id===id);
  if(!a) return;
  const destination = document.getElementById('allocDest').value.trim();
  const agency = document.getElementById('allocAgency').value.trim();
  const qtyRaw = document.getElementById('allocQty').value.trim();
  const origin = document.getElementById('allocOrigin').value.trim();
  const nos = parseLockNos(document.getElementById('allocLockNos').value);
  if(!destination || !agency || !origin){ pushToast('Enter origin, destination and agency.', 'err'); return; }
  if(state.allocations.some(x=>x.id!==id && allocKey(x.destination,x.agency)===allocKey(destination,agency))){ pushToast('That destination and agency already has an allocation.', 'err'); return; }
  const usedNow = allocUsedCount(a.destination, a.agency);
  if(usedNow>0 && allocKey(destination,agency)!==allocKey(a.destination,a.agency)){ pushToast(`Destination/agency can't change while ${usedNow} lock(s) are assigned to it.`, 'err'); return; }
  const {ids, errors} = resolveLockNos(nos, destination, agency, id);
  if(errors.length){ pushToast('Lock number issue — ' + errSummary(errors), 'err'); return; }
  const dropped = allocLocks(a).filter(l=>l.status!=='available' && !ids.includes(l.id));
  if(dropped.length){ pushToast(`${dropped.map(l=>l.lockNo).slice(0,3).join(', ')} already assigned — can't be removed from this allocation.`, 'err'); return; }
  const qty = qtyRaw==='' ? ids.length : Number(qtyRaw);
  if(!Number.isInteger(qty) || qty<0){ pushToast('Enter a valid whole-number quantity.', 'err'); return; }
  if(qty < ids.length){ pushToast(`Quantity ${qty} is less than the ${ids.length} lock number(s) listed.`, 'err'); return; }
  if(qty < usedNow){ pushToast(`Cannot set below ${usedNow} — that many locks are already assigned.`, 'err'); return; }
  Object.assign(a,{origin,destination,agency,qty,lockIds:ids,updatedAt:nowStamp()});
  await storageSet('st:allocations', state.allocations);
  closeModal();
  pushToast('Allocation updated.', 'ok');
}
async function deleteAlloc(id){
  const a = state.allocations.find(x=>x.id===id);
  if(!a) return;
  const usedNow = allocUsedCount(a.destination, a.agency);
  if(usedNow>0){ pushToast(`Can't delete: ${usedNow} lock(s) are assigned to ${a.agency} → ${a.destination}. Release them first.`, 'err'); return; }
  if(!confirm(`Delete allocation for ${a.agency} → ${a.destination}? Its reserved lock numbers are released.`)) return;
  state.allocations = state.allocations.filter(x=>x.id!==id);
  await storageSet('st:allocations', state.allocations);
  pushToast('Allocation deleted.', 'ok');
  render();
}

/* --- Bulk upload allocations (with origin and lock numbers) --- */
function modalBulkAlloc(){
  const body = `
    <div class="upload-drop">
      <div style="font-size:13.5px;font-weight:600;">Upload a file (.xlsx, .xls or .csv)</div>
      <div class="helper-text">Columns: <b>Origin</b>, <b>Destination</b>, <b>Agency</b>, <b>Qty</b>, <b>Lock No</b>. Use one row per lock number (repeat Origin, Destination and Agency), or put several lock numbers in one cell separated by commas.</div>
      <input type="file" id="bulkAllocFile" accept=".xlsx,.xls,.csv">
    </div>
    <button type="button" class="template-link" style="margin-top:12px;" onclick="downloadAllocTemplate()">Download a blank template (.xlsx)</button>
    <div class="divider-or">or paste rows</div>
    <div class="field">
      <label for="bulkAllocText">Origin, Destination, Agency, Qty, Lock No</label>
      <textarea id="bulkAllocText" rows="5" placeholder="Manila Port, Cebu Warehouse, Metro Freight, 50, GPS-000123&#10;Manila Port, Cebu Warehouse, Metro Freight, , GPS-000124&#10;Manila Port, Davao Hub, Metro Freight, 30"></textarea>
    </div>
    <p class="helper-text">Origin is looked up by Truck Lock Assigning, so include it for new allocations. Qty is optional when lock numbers are given (it becomes the lock count; for an existing allocation it never drops below what's there). Lock numbers are <b>added</b> to an existing allocation, must already exist as Available in Truck Lock Assigning, and can't belong to another destination/agency. Rejected lock numbers are skipped and reported.</p>
  `;
  const footer = `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-accent" onclick="submitBulkAlloc()">Upload allocations</button>`;
  return modalShell('Bulk upload allocations', 'Add or update origin, destination, agency, quantity and lock numbers.', body, footer);
}
function downloadAllocTemplate(){
  const ws = XLSX.utils.json_to_sheet([
    {Origin:'Manila Port', Destination:'Cebu Warehouse', Agency:'Metro Freight', Qty:50, 'Lock No':'GPS-000123'},
    {Origin:'Manila Port', Destination:'Cebu Warehouse', Agency:'Metro Freight', Qty:'', 'Lock No':'GPS-000124'}
  ]);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Template');
  XLSX.writeFile(wb, 'spx_truck_lock_gps_allocation_template.xlsx');
}
function findAllocCol(headers, cands){
  const lower = headers.map(h=>String(h).trim().toLowerCase());
  for(const c of cands){ const i = lower.indexOf(c); if(i>-1) return headers[i]; }
  return null;
}
async function submitBulkAlloc(){
  const fileInput = document.getElementById('bulkAllocFile');
  const text = document.getElementById('bulkAllocText').value;
  let entries = [];
  try{
    if(fileInput && fileInput.files && fileInput.files[0]){
      const rows = await extractRowsFromFile(fileInput.files[0]);
      if(rows.length){
        const hs = Object.keys(rows[0]);
        let O = findAllocCol(hs, ['origin','from','origin name']);
        let D = findAllocCol(hs, ['destination','dest','to']);
        let A = findAllocCol(hs, ['agency','agency name']);
        let Q = findAllocCol(hs, ['qty','quantity','lock qty allocated','lock qty','allocated','allocation','qty allocated']);
        let L = findAllocCol(hs, ['lock no','lock no.','lock number','lock numbers','lock nos','lock','gps lock no','gps lock','serial no','serial']);
        if(!D && !A){ O=hs[0]; D=hs[1]; A=hs[2]; Q=hs[3]||null; L=hs[4]||null; } // no recognised headers: Origin, Destination, Agency, Qty, Lock No
        rows.forEach(r=>entries.push({o:O?String(r[O]??'').trim():'', d:D?String(r[D]??'').trim():'', a:A?String(r[A]??'').trim():'', q:Q?r[Q]:'', l:L?r[L]:''}));
      }
    }
  }catch(e){
    pushToast('Could not read that file. Please check the format.', 'err');
    return;
  }
  if(text.trim()){
    text.split(/\n+/).forEach(line=>{
      if(!line.trim()) return;
      const parts = line.split(/\t|,/).map(x=>x.trim());
      entries.push({o:parts[0]||'', d:parts[1]||'', a:parts[2]||'', q:parts[3]||'', l:parts.slice(4).join(',')});
    });
  }
  entries = entries.filter(e=>e.o || e.d || e.a || String(e.q).trim() || String(e.l).trim());
  if(entries.length===0){ pushToast('No allocation rows found to upload.', 'err'); return; }

  const groups = new Map();
  let skipped = 0;
  entries.forEach(e=>{
    const qStr = String(e.q==null?'':e.q).replace(/,/g,'').trim();
    const nos = parseLockNos(e.l);
    let qty = null;
    if(qStr!==''){
      qty = Number(qStr);
      if(!Number.isInteger(qty) || qty<0){ skipped++; return; }
    }
    if(!e.d || !e.a || (qty===null && nos.length===0)){ skipped++; return; }
    const k = allocKey(e.d,e.a);
    if(!groups.has(k)) groups.set(k, {origin:'', destination:e.d, agency:e.a, qty:null, nos:[]});
    const g = groups.get(k);
    if(e.o) g.origin = e.o;
    if(qty!==null) g.qty = qty;
    nos.forEach(n=>{ if(!g.nos.some(x=>x.toLowerCase()===n.toLowerCase())) g.nos.push(n); });
  });

  let added=0, updated=0, belowUsed=0, belowLocks=0, lockCount=0, noOrigin=0;
  const lockErrors = [];
  groups.forEach(g=>{
    const ex = findAllocation(g.destination, g.agency);
    const {ids, errors} = resolveLockNos(g.nos, g.destination, g.agency, ex?ex.id:null);
    errors.forEach(er=>lockErrors.push(er));
    const existingIds = ex ? (ex.lockIds||[]).filter(id=>lockById(id)) : [];
    const merged = Array.from(new Set([...existingIds, ...ids]));
    if(!ex && g.qty===null && merged.length===0){ skipped++; return; }
    const qty = g.qty!==null ? g.qty : (ex ? Math.max(ex.qty, merged.length) : merged.length);
    if(qty < merged.length){ belowLocks++; return; }
    if(ex && qty < allocUsedCount(ex.destination, ex.agency)){ belowUsed++; return; }
    lockCount += merged.length - existingIds.length;
    if(ex){ ex.qty = qty; ex.lockIds = merged; if(g.origin) ex.origin = g.origin; ex.updatedAt = nowStamp(); updated++; if(!ex.origin) noOrigin++; }
    else { state.allocations.push({id:genId('al'), origin:g.origin, destination:g.destination, agency:g.agency, qty, lockIds:merged, createdAt:nowStamp()}); added++; if(!g.origin) noOrigin++; }
  });
  if(added+updated===0){
    const why = [];
    if(belowLocks) why.push(`${belowLocks} group(s): qty less than lock numbers listed`);
    if(belowUsed) why.push(`${belowUsed} group(s): qty below locks already assigned`);
    if(lockErrors.length) why.push(errSummary(lockErrors));
    pushToast('Nothing uploaded. ' + (why.join('; ') || `${skipped} row(s) invalid — need destination, agency, and a qty or lock no.`), 'err');
    return;
  }
  await storageSet('st:allocations', state.allocations);
  closeModal();
  const extra = [];
  if(skipped) extra.push(`${skipped} invalid row(s) skipped`);
  if(belowLocks) extra.push(`${belowLocks} skipped (qty < lock numbers)`);
  if(belowUsed) extra.push(`${belowUsed} skipped (qty < assigned)`);
  if(noOrigin) extra.push(`${noOrigin} allocation(s) have no origin yet — add one before assigning`);
  if(lockErrors.length) extra.push(`${lockErrors.length} lock no. rejected — ${errSummary(lockErrors)}`);
  pushToast(`${added} added, ${updated} updated, ${lockCount} lock no. reserved.` + (extra.length ? ' ' + extra.join('; ') + '.' : ''), extra.length ? 'err' : 'ok');
}

function modalViewAllocLocks(dest, agency){
  const a = findAllocation(dest, agency);
  const k = allocKey(dest, agency);
  const reserved = a ? allocLocks(a).filter(l=>l.status==='available') : [];
  const active = state.locks.filter(l=>(l.status==='assigned'||l.status==='received'||l.status==='returning') && allocKey(l.destination,l.agency)===k);
  const locks = [...active, ...reserved].sort((x,y)=>x.lockNo.localeCompare(y.lockNo,undefined,{numeric:true}));
  const body = `
    <p class="helper-text" style="margin:0 0 10px;">${active.length} assigned, ${reserved.length} reserved (not assigned yet).</p>
    <div class="table-wrap"><table>
      <thead><tr><th>#</th><th>Lock No.</th><th>Status</th><th>Plate</th><th>Assigned</th></tr></thead>
      <tbody>${locks.map((l,i)=>`<tr><td>${i+1}</td><td class="mono">${escapeHtml(l.lockNo)}</td><td>${l.status==='available' ? '<span class="badge badge-available">Reserved</span>' : statusBadge(l.status)}</td><td class="mono">${escapeHtml(l.plate||'—')}</td><td>${l.assignedAt?fmtDate(l.assignedAt):'—'}</td></tr>`).join('')}</tbody>
    </table></div>`;
  return modalShell('Lock numbers', `${escapeHtml(agency)} → ${escapeHtml(dest)}`, body, `<button class="btn btn-ghost" onclick="closeModal()">Close</button>`);
}

initApp();
